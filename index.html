<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanya Thomas — Journalist and Researcher</title>
<meta name="description" content="News reporting and podcasts on sustainability, clean energy, infrastructure and corporate finance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202b;--muted:#5d6b7a;--rule:#d9e0e7;--accent:#0f766e;--ph:#e3e9ee;
--head:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Literata",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--card:#18222c;--ink:#e8eef4;--muted:#9fb0c0;--rule:#2a3846;--accent:#5eead4;--ph:#223140}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--head)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:3rem 1.5rem 4rem}
header{display:flex;gap:2rem;align-items:center;padding-bottom:2rem;border-bottom:1px solid var(--rule)}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;flex:none;background:var(--ph)}
h1{font:700 clamp(2.3rem,5vw,3.4rem)/1 var(--head);letter-spacing:-.03em;margin:0 0 .5rem}
.loc{margin:0 0 .25rem;color:var(--muted)}
.role{font-weight:500;margin:.75rem 0 .25rem;color:var(--accent)}
.bio{margin:0;max-width:60ch}
.links{display:flex;gap:1.25rem;margin:.75rem 0 0;padding:0;list-style:none;font-weight:500}
.links a{text-underline-offset:4px}
.links a:hover{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:1.75rem 0 .5rem}
.bar button{font:500 .9rem var(--head);background:none;color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:.3rem .85rem;cursor:pointer}
.bar button:hover{border-color:var(--accent)}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);margin:1.75rem 0 .75rem}
#views{margin:0 0 1.25rem}
.cols{display:flex;gap:1.25rem;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
.grid .card{display:flex;flex-direction:column}
.grid .in{flex:1}
.grid .blurb{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.card{display:block;background:var(--card);border:1px solid var(--rule);border-radius:6px;overflow:hidden;text-decoration:none}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:3/2;background:var(--ph);overflow:hidden}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.in{padding:1rem 1.15rem 1.25rem}
.view{display:block;text-align:right;color:var(--accent);font-weight:500;font-size:.95rem}
.client{font:700 .72rem/1 var(--head);letter-spacing:.14em;text-transform:uppercase;margin:.35rem 0 .6rem}
.card h2{font:700 1.2rem/1.25 var(--head);letter-spacing:-.01em;margin:0 0 .5rem}
.card:hover h2{color:var(--accent)}
.blurb{font:400 .92rem/1.55 var(--body);margin:0 0 .6rem}
.date{font-size:.85rem;color:var(--muted);margin:0}
@media (max-width:640px){header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

    </div>

  <p class="count" id="count" aria-live="polite"></p>
  <div class="bar" id="views" role="group" aria-label="Layout"></div>
  <main class="grid" id="cols"></main>
</div>

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(d){const [y,m,day]=d.split("-");return m?(day?Number(day)+" ":"")+MONTHS[Number(m)-1]+" "+y:y}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

const colsEl=document.getElementById("cols"), count=document.getElementById("count");
let active="All", timer;

function card(p){
  const a=document.createElement("a");
  a.className="card"; a.href=p.url; a.target="_blank"; a.rel="noopener";
  a.innerHTML=`<div class="thumb"><img src="images/${esc(p.id)}.jpg" alt="" loading="lazy"></div>
    <div class="in"><span class="view">View ↗</span><p class="client">${esc(p.client)}</p>
    <h2>${esc(p.title)}</h2><p class="blurb">${esc(p.blurb)}</p><p class="date">${esc(fmt(p.date))}</p></div>`;
  a.querySelector("img").addEventListener("error",e=>{e.target.parentNode.remove();relayout()});
  return a;
}

function layout(){
  colsEl.className=view==="grid"?"grid":"cols";
  if(view==="grid"){colsEl.replaceChildren(...list);return}
  const w=colsEl.clientWidth, n=w>=860?3:w>=540?2:1;
  const cols=Array.from({length:n},()=>{const c=document.createElement("div");c.className="col";return c});
  colsEl.replaceChildren(...cols);
  list.forEach(c=>{cols.reduce((s,x)=>x.offsetHeight<s.offsetHeight?x:s).appendChild(c)});
}
function relayout(){clearTimeout(timer);timer=setTimeout(layout,60)}

let list=[], view="grid";
function render(){
  const shown=pieces.filter(p=>active==="All"||p.client===active)
    .sort((a,b)=>(a.pin||99)-(b.pin||99)||b.date.localeCompare(a.date));
  list=shown.map(card);
  count.textContent=shown.length+" projects";
  layout();
}

const views=document.getElementById("views");
[["grid","Grid"],["columns","Columns"]].forEach(([v,label])=>{
  const b=document.createElement("button");
  b.textContent=label; b.dataset.v=v;
  b.addEventListener("click",()=>{view=v;views.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===view)));layout()});
  views.appendChild(b);
});
views.firstChild.setAttribute("aria-pressed","true");
window.addEventListener("resize",relayout);
window.addEventListener("load",relayout);
render();
</script>
